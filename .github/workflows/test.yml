# .github/workflows/test.yml
#
# test: runs the full backend test suite on every push and pull request.
# Uses Gocabservices.settings.test (in-memory SQLite, locmem cache,
# console email, in-memory channel layer) — no Redis/Postgres service
# containers needed here, and nothing in this job can ever touch real
# data.
#
# deploy: only on a push to main, and only if `test` passed — syncs the
# backend to production and restarts it as the dedicated `deploy` user
# (narrow sudo rule: can restart gocab-backend, nothing else; SSH
# key-only, no password login). This is the actual gate: a failing test
# suite physically cannot reach production, not just "shouldn't."
name: Backend Tests and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches production (confirmed on the live server) and
          # Pipfile's [requires] section.
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        # `sync`, not `install` — sync installs exactly the hashes pinned
        # in Pipfile.lock, no resolution step at all. We were on `install`
        # before because the lock was stale (generated back when
        # [requires] said Python 3.9, so its typing_extensions marker
        # excluded 3.12 even though Twisted/daphne need it regardless of
        # version) — `install` re-resolves fresh to route around that.
        # But a fresh resolve ignores Pipfile.lock's pin and can grab a
        # different version of anything left unpinned in Pipfile: that's
        # exactly how django = "*" silently became Django 6.x one run,
        # which dropped CheckConstraint's `check=` kwarg (renamed to
        # `condition=` in 5.1, removed in 6.0) that the Rating model
        # uses. The lock has since been regenerated fresh under 3.12
        # (confirmed: typing_extensions' marker is now
        # python_version >= "3.9", no longer 3.9-only) and Django is
        # pinned in Pipfile too, so `sync` is safe again and removes the
        # drift risk `install` reintroduced.
        run: pipenv sync --dev

      - name: Run tests
        env:
          # base.py requires SECRET_KEY to be set at all (os.getenv with no
          # default) even though settings/test.py doesn't use it for
          # anything security-sensitive — a throwaway value is fine here.
          SECRET_KEY: "ci-test-secret-key-not-used-for-anything-real"
          # utils/distance_utils.py builds a googlemaps.Client at *import*
          # time, unconditionally — its constructor validates the key
          # format (must start with "AIza") even though no test here ever
          # makes a real network call (route_with_coords is mocked
          # wherever it matters). Without this, test collection itself
          # fails with ValueError before a single test runs.
          GOOGLE_MAPS_API_KEY: "AIzaCiPlaceholderKeyNeverUsedForRealCalls0"
        run: pipenv run python manage.py test gocabapp.tests --settings=Gocabservices.settings.test -v 2

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync backend code
        # --delete only inside gocabapp/ and Gocabservices/ specifically —
        # confirmed directly on the server that .env, secrets/, venv/,
        # static/, staticfiles/ all live as siblings of these two
        # directories, never nested inside them, so --delete here can
        # never reach any of those regardless of what changes in the repo.
        #
        # __pycache__/*.pyc is excluded on both sides: those files get
        # regenerated on the server by gocab-backend.service itself
        # (running as a different system user than `deploy`), so rsync's
        # --delete has no permission to unlink them — caught by a real
        # deploy failing with "Permission denied (13)". Bytecode cache is
        # disposable and shouldn't be synced or deleted by rsync at all.
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          rsync -az --delete --exclude='__pycache__/' --exclude='*.pyc' -e "$RSYNC_SSH" gocabapp/ deploy@${{ secrets.DEPLOY_HOST }}:/srv/gocab/gocabapp/
          rsync -az --delete --exclude='__pycache__/' --exclude='*.pyc' -e "$RSYNC_SSH" Gocabservices/ deploy@${{ secrets.DEPLOY_HOST }}:/srv/gocab/Gocabservices/
          rsync -az -e "$RSYNC_SSH" manage.py Pipfile Pipfile.lock deploy@${{ secrets.DEPLOY_HOST }}:/srv/gocab/

      - name: Install any new dependencies, migrate, restart
        # `pipenv requirements`, not `pipenv sync` — sync creates/uses its
        # own separate virtualenv under pipenv's own management, which is
        # NOT /srv/gocab/venv, the one gocab-backend.service's ExecStart
        # actually points to. New dependencies installed that way would
        # silently never reach the running service. `requirements` only
        # exports a plain requirements.txt — no environment created —
        # which gets piped straight into that existing venv's own pip.
        # `pipenv lock` runs first to refresh it against the Pipfile that
        # was just rsynced over, not trust whatever Pipfile.lock shipped
        # with the repo: a real CI run caught that lock file carrying
        # stale per-package environment markers from when [requires] said
        # Python 3.9 (twisted needed typing_extensions regardless of
        # version; the stale lock's marker said otherwise and it silently
        # wasn't installed) — re-locking fresh under this venv's actual
        # 3.12 avoids the same failure here.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /srv/gocab
            ./venv/bin/pip install --quiet pipenv
            ./venv/bin/pipenv lock
            ./venv/bin/pipenv requirements > /tmp/gocab_requirements.txt
            ./venv/bin/pip install -r /tmp/gocab_requirements.txt
            rm /tmp/gocab_requirements.txt
            ./venv/bin/python manage.py migrate --noinput
            sudo systemctl restart gocab-backend
          '

      - name: Verify it is actually up
        run: |
          sleep 3
          status=$(curl -s -o /dev/null -w "%{http_code}" https://api.gocablogistics.com/privacy)
          echo "Post-deploy health check: $status"
          if [ "$status" != "200" ]; then
            echo "Deploy finished but the server isn't responding healthily — check it by hand."
            exit 1
          fi
