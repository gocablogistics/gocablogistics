# .github/workflows/ios-build.yml
#
# The iOS build genuinely cannot run anywhere else: `tauri ios init` itself
# (not just `ios build`) needs a full Xcode 15.3+ install, which needs
# macOS 13+ — confirmed directly against this project's Mac (a 2015 MBP
# capped at macOS 12), which can't even scaffold the iOS project, let
# alone build it. So unlike Android, there is no local fallback at all;
# every run of this workflow is the only way to produce an iOS build.
#
# Scope deliberately stops at producing a signed .ipa as a downloadable
# artifact — it does NOT auto-upload to TestFlight/App Store Connect.
# Apple's own CLI upload story is in flux (`altool --upload-app` is being
# phased out, its replacement isn't settled enough to script blind into a
# real CI run against a live Apple account). Until that's verified for
# real, download the artifact from the workflow run and upload it via
# Apple's own Transporter app (free on the Mac App Store, drag-and-drop) —
# safer than guessing a CLI command against production Apple infrastructure.
name: iOS Build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    # Job-level, not just on the explicit "Build frontend" step below: Tauri's
    # `beforeBuildCommand` (`npm run build`) also reruns automatically inside
    # `tauri ios build` itself, with none of a prior step's env vars carried
    # over. That second, implicit build was silently clobbering the first
    # one's correctly-built dist/ with the http://127.0.0.1:8000 dev fallback
    # (confirmed live via Safari's remote Web Inspector on a real device —
    # every request was going to 127.0.0.1:8000, not production, which is why
    # OTP send failed with "could not connect to the server" on every build
    # so far, unrelated to all the CORS/ATS/TLS fixes tried before this).
    env:
      VITE_API_BASE_URL: https://api.gocablogistics.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Tauri's docs document exactly these three env vars for App Store
      # Connect API key signing in CI — see https://v2.tauri.app/distribute/sign/ios/.
      # The key file's path is explicit (APPLE_API_KEY_PATH), not
      # auto-discovered, but it's named the way Apple's own tooling expects
      # (AuthKey_<KeyID>.p8) in case anything underneath also looks for it.
      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"

      - name: Init iOS project
        working-directory: frontend
        run: npm run tauri -- ios init
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      # `tauri ios init` creates gen/apple's Xcode asset catalog seeded with
      # Tauri's own placeholder icon, not src-tauri/icons/ios/'s real GoCab
      # icon set — confirmed this is a known Tauri CLI quirk (other projects
      # hit the identical bug), not something specific to this setup.
      # `tauri icon` only overwrites that catalog if it's rerun *after* init,
      # once gen/apple actually exists; run before init, it only writes back
      # to src-tauri/icons/ios/ itself, never touching gen/apple. Every build
      # so far skipped this step, which is why TestFlight showed Tauri's
      # default icon instead of GoCab's logo despite icons/ios/ being correct
      # the whole time.
      - name: Regenerate app icons into the Xcode project
        working-directory: frontend
        run: npm run tauri -- icon src-tauri/icons/icon.png

      # Enabling "Push Notifications" on the App ID in the Apple Developer
      # portal only makes the capability available — it does NOT get baked
      # into the app automatically. Confirmed directly against a real signed
      # .ipa from this pipeline (`codesign -d --entitlements :- GoCab\
      # Logistics.app`): the entitlements block had application-identifier/
      # team-identifier/get-task-allow/beta-reports-active (all auto-added
      # by Xcode's signing) but no aps-environment key at all — which is
      # exactly why iOS never issued the app an APNs token and
      # getFcmToken() silently failed on every build so far (zero iOS rows
      # ever appeared in the production DeviceToken table, confirmed
      # directly against prod). Tauri's iOS template has no config field for
      # this (confirmed against tauri-utils' IosConfig and the "xcode"
      # template pack — no entitlements field, no generated file with real
      # content), so this step copies a real one in after `ios init`
      # generates the Xcode project but before the build/codesign step reads
      # it. "production" (not "development") because this is signed with an
      # Apple Distribution certificate for App Store Connect/TestFlight.
      - name: Add push-notification entitlement
        run: cp frontend/src-tauri/ios-entitlements/gocab_iOS.entitlements frontend/src-tauri/gen/apple/gocab_iOS/gocab_iOS.entitlements

      # Sets bundle.iOS.bundleVersion directly (confirmed via Tauri's own
      # config.rs: "Translates to the bundle's CFBundleVersion property") —
      # NOT --build-number, which was tried first and made things worse:
      # that flag concatenates onto the full app version
      # (config.bundle_version() + "." + N, confirmed in Tauri CLI's
      # build.rs), producing "0.1.1.29" instead of a clean "29". Apple
      # compares CFBundleVersion component-by-component — "0.1.1.29" against
      # this app's existing plain-integer build history (9, 8, 7, ...)
      # compares "0" against "9" on the very first component and loses, so
      # TestFlight never offered it as an update at all despite uploading
      # successfully with no error. A clean integer from github.run_number
      # (which auto-increments on every workflow run, so it can never
      # collide with a previous upload) compares correctly against both the
      # old plain-integer builds and the one bad "0.1.1.28" build already
      # sitting on Apple's servers from before this fix.
      - name: Build iOS app
        working-directory: frontend
        run: npm run tauri -- ios build --export-method app-store-connect --ci --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      # Wildcarded rather than a guessed exact path — this is the first
      # real run of this pipeline, with no way to have tested locally what
      # Tauri actually names the output or which subfolder it lands in.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gocab-ios-ipa
          path: frontend/src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error

      # A release-config archive build normally produces dSYMs alongside the
      # .ipa — needed to turn a raw on-device crash report (all
      # "imageOffset"/no symbol names, since TestFlight builds ship
      # stripped) into actual function names and line numbers via atos.
      # Never uploaded before now, so the "could not send code"/icon/etc.
      # bugs this session were all diagnosed from source review or live
      # device inspection — this is the first actual native *crash* hit,
      # which needs a dSYM to read at all. warn, not error: the exact path
      # Tauri's export produces this at isn't confirmed yet, same
      # uncertainty the .ipa wildcard above already had on its first run.
      - name: Upload dSYMs for crash symbolication
        uses: actions/upload-artifact@v4
        with:
          name: gocab-ios-dsyms
          path: frontend/src-tauri/gen/apple/**/*.dSYM
          if-no-files-found: warn
