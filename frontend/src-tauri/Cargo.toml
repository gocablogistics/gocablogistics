[package]
name = "gocab"
version = "0.1.0"
description = "GoCab desktop and mobile app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "devtools" is required for Safari's remote Web Inspector to see anything
# at all on iOS — Tauri only sets WKWebView's isInspectable (a public,
# App-Store-safe API on iOS, unlike the private API it uses on macOS) when
# this feature is compiled in, and it's off by default in release builds.
# Needed to actually see the JS-level error behind the iOS "could not send
# code" failure instead of guessing a fourth server/config fix blind.
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-geolocation = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-gocab-native = { path = "plugins/tauri-plugin-gocab-native" }
