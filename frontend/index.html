<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,800;1,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>GoCab</title>
    <style>
      /* Shown instantly, before any JavaScript has loaded; React replaces the
         contents of #root the moment it mounts. Same look as components/Loader. */
      html, body { margin: 0; background: #20241f; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; background: #20241f; }
      .boot-mark { position: relative; width: 108px; height: 108px; display: flex;
        align-items: center; justify-content: center; }
      .boot-mark img { position: relative; width: 78%; height: 78%; object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(27,228,81,.35)); animation: boot-breathe 2.2s ease-in-out infinite; }
      .boot-ring { position: absolute; inset: 0; border-radius: 9999px; border: 2px solid #1be451;
        opacity: 0; animation: boot-ripple 2.2s cubic-bezier(.2,.6,.3,1) infinite; }
      .boot-late { animation-delay: 1.1s; }
      .boot-bar { position: relative; width: 72px; height: 3px; border-radius: 9999px;
        background: rgba(255,255,255,.08); overflow: hidden; }
      .boot-bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 9999px;
        background: #1be451; animation: boot-slide 1.3s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes boot-ripple { 0% { transform: scale(.6); opacity: .5 } 100% { transform: scale(1.55); opacity: 0 } }
      @keyframes boot-breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
      @keyframes boot-slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark img, .boot-bar span { animation: none }
        .boot-ring { animation: none; opacity: .2; transform: scale(1.25) }
        .boot-bar span { width: 100%; opacity: .5 }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-mark">
          <span class="boot-ring"></span><span class="boot-ring boot-late"></span>
          <img src="/gocab-logo.png" alt="" />
        </div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
