<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoCab verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f3;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f3;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:14px;overflow:hidden;max-width:480px;">
          <tr>
            <td style="background-color:#20241f;padding:32px 0;text-align:center;">
              <img src="cid:{{ logo_cid }}" width="56" height="56" alt="GoCab" style="display:block;margin:0 auto 10px;border-radius:12px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.5px;">GoCab</span>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 40px 8px;">
              <p style="font-size:15px;color:#333333;margin:0 0 22px;">Your verification code is:</p>
              <div style="text-align:center;margin:0 0 26px;">
                <span style="display:inline-block;background-color:#eafff1;color:#0f8a3c;font-size:32px;font-weight:bold;letter-spacing:8px;padding:14px 22px;border-radius:10px;">{{ code }}</span>
              </div>
              <p style="font-size:14px;color:#555555;margin:0 0 6px;">This code expires in 10 minutes.</p>
              <p style="font-size:13px;color:#999999;margin:0 0 28px;">If you didn't request this, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 40px 26px;border-top:1px solid #eeeeee;text-align:center;">
              <p style="font-size:12px;color:#aaaaaa;margin:0;">GoCab Logistics &middot; gocablogistics.com</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
