<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GoCab{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f3;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f3;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:14px;overflow:hidden;max-width:560px;">
          <tr>
            <td style="background-color:#20241f;padding:28px 0;text-align:center;">
              <img src="cid:{{ logo_cid }}" width="48" height="48" alt="GoCab" style="display:block;margin:0 auto 8px;border-radius:10px;">
              <span style="color:#ffffff;font-size:18px;font-weight:bold;letter-spacing:0.5px;">GoCab</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 36px 8px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 36px 26px;border-top:1px solid #eeeeee;text-align:center;">
              <p style="font-size:12px;color:#aaaaaa;margin:0;">GoCab Logistics &middot; gocablogistics.com</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
